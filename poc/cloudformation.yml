AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LLM Usage Lens POC - one EC2 instance (Amazon Linux 2023, Docker, Compose,
  SSM Session Manager), its security group and IAM role, and a private ECR
  repository. Uses an existing VPC and subnet, and optionally publishes the
  application through an existing Application Load Balancer: either by adding
  a listener (listener mode) or by adding one rule to an existing listener
  that another application uses (rule mode, under BasePath). Does not deploy
  or start the application. Deleting this stack deletes the ECR repository and its images.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Existing network }
        Parameters: [VpcId, SubnetId]
      - Label: { default: EC2 instance }
        Parameters:
          - InstanceName
          - InstanceType
          - InstanceArchitecture
          - RootVolumeSizeGiB
          - ComposeVersion
      - Label: { default: Application access }
        Parameters: [AppPort, AllowedInboundCidr]
      - Label: { default: Existing Application Load Balancer (optional) }
        Parameters:
          - ExistingAlbArn
          - AlbAllowedInboundCidr
          - AlbListenerPort
          - AlbCertificateArn
      - Label:
          {
            default: Existing ALB listener rule (optional,
            instead of a listener),
          }
        Parameters:
          - ExistingAlbListenerArn
          - AlbRulePriority
          - BasePath
      - Label: { default: ECR }
        Parameters: [EcrRepositoryName, UntaggedImageRetentionDays]
      - Label: { default: S3 artifact bucket (optional) }
        Parameters: [ArtifactBucketName, ArtifactKeyPrefix]

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC. The stack creates no network resources.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Existing subnet in VpcId. It must give the instance outbound access to
      Systems Manager, ECR, S3 and the external LiteLLM endpoint (internet
      egress or VPC endpoints); see poc/README.md.
  InstanceName:
    Type: String
    Default: llm-usage-lens-poc
    MinLength: 1
    MaxLength: 128
    Description: Name tag of the EC2 instance.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedPattern: "^[a-z][a-z0-9-]*\\.[a-z0-9]+$"
    ConstraintDescription: must be an EC2 instance type such as t4g.small or t3.small.
    Description: >-
      EC2 instance type. Its CPU architecture must match InstanceArchitecture
      (t4g/c7g/m7g are arm64; t3/t3a/m6i are x86_64). 2 GiB of memory or more.
  InstanceArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >-
      CPU architecture of InstanceType. Selects the Amazon Linux 2023 AMI and
      the image platform reported in the ImagePlatform output.
  RootVolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 200
    Description: Size of the encrypted gp3 root volume, in GiB.
  ComposeVersion:
    Type: String
    Default: v2.32.4
    AllowedPattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
    ConstraintDescription: must be a Docker Compose release tag such as v2.32.4.
    Description: >-
      Docker Compose release installed when the Amazon Linux repositories do
      not provide the Compose plugin package: first from the artifact bucket
      (<ArtifactKeyPrefix>/compose/<version>/), then from GitHub.
  AppPort:
    Type: Number
    Default: 3000
    MinValue: 1024
    MaxValue: 65535
    Description: >-
      Host port the application is published on. Only used for the inbound
      rule created when AllowedInboundCidr is set; must equal APP_PORT in the
      instance's .env.
  AllowedInboundCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$"
    ConstraintDescription: must be empty or an IPv4 CIDR such as 203.0.113.10/32.
    Description: >-
      Optional trusted IPv4 CIDR allowed to reach AppPort. Empty (default)
      creates no inbound rule; reach the application through SSM port
      forwarding. 0.0.0.0/0 is rejected.
  ExistingAlbArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:loadbalancer/app/[A-Za-z0-9-]+/[a-f0-9]+$"
    ConstraintDescription: must be empty or the ARN of an Application Load Balancer.
    Description: >-
      Optional ARN of an existing Application Load Balancer in VpcId. When
      set, the stack adds one target group to it and creates a new security
      group for it (output AlbSecurityGroupId), and either one listener
      (listener mode) or, with ExistingAlbListenerArn, one listener rule (rule
      mode). CloudFormation
      cannot attach that group to a load balancer it does not own: attach it
      with poc/scripts/alb-security-group.sh. The load balancer, its existing
      security groups and its certificates are never created, changed or
      deleted by this stack. Empty (default) adds nothing.
  AlbAllowedInboundCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$"
    ConstraintDescription: must be empty or an IPv4 CIDR such as 203.0.113.0/24.
    Description: >-
      Optional IPv4 CIDR the new load balancer security group allows on
      AlbListenerPort. Empty (default) adds no inbound rule to it; inbound
      access to the listener then depends on the load balancer's existing
      security groups.
  AlbListenerPort:
    Type: Number
    Default: 443
    MinValue: 1
    MaxValue: 65535
    Description: >-
      Port of the listener added to the existing load balancer. It must be
      free on that load balancer.
  AlbCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$"
    ConstraintDescription: must be empty or an ACM certificate ARN in this region.
    Description: >-
      ACM certificate for the listener. Set: the listener is HTTPS. Empty: the
      listener is plain HTTP (use only on an internal load balancer).
  ExistingAlbListenerArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-z-]*:elasticloadbalancing:[a-z0-9-]+:[0-9]{12}:listener/app/[A-Za-z0-9-]+/[a-f0-9]+/[a-f0-9]+$"
    ConstraintDescription: must be empty or the ARN of an Application Load Balancer listener.
    Description: >-
      Rule mode. ARN of an existing listener (for example the HTTPS 443
      listener another application already uses). The stack adds one rule to
      it that forwards BasePath and BasePath/* to this POC; the listener, its
      certificate and its other rules are never created, changed or deleted.
      Requires ExistingAlbArn, AlbRulePriority and BasePath, and no
      AlbCertificateArn (the listener already has its own). Empty (default):
      no rule.
  AlbRulePriority:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([1-9][0-9]{0,3}|[1-4][0-9]{4}|50000)$"
    ConstraintDescription: must be empty or a rule priority from 1 to 50000.
    Description: >-
      Rule mode. Priority of the new rule, 1 to 50000. It must be unused on
      the listener and lower than any catch-all rule of the other application.
      Required with ExistingAlbListenerArn.
  BasePath:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(/[a-z0-9-]+)+$"
    ConstraintDescription: must be empty or lower-case /segments such as /llm-lens, with no trailing slash.
    Description: >-
      URL prefix the image was built with (NEXT_PUBLIC_BASE_PATH). The health
      check path becomes BasePath/api/health, and in rule mode the rule
      forwards BasePath and BasePath/* only (never BasePath*, which would also
      match a sibling such as /llm-lens-other). Required with
      ExistingAlbListenerArn. Empty (default): the app serves from /.
  EcrRepositoryName:
    Type: String
    Default: llm-usage-lens-poc
    AllowedPattern: "^[a-z0-9]+(?:[._/-][a-z0-9]+)*$"
    MinLength: 2
    MaxLength: 256
    ConstraintDescription: must be a valid lowercase ECR repository name.
    Description: Name of the private ECR repository created by this stack.
  UntaggedImageRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Days after which untagged images (superseded "latest" pushes) expire.
  ArtifactBucketName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: must be empty or an S3 bucket name.
    Description: >-
      Optional existing S3 bucket the instance may read from (config.yaml,
      the Docker Compose binary). The stack never creates, changes or deletes
      it. Empty: no S3 access.
  ArtifactKeyPrefix:
    Type: String
    Default: llm-usage-lens-poc
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*[A-Za-z0-9]$"
    ConstraintDescription: must be a key prefix without leading or trailing slash.
    Description: >-
      Key prefix inside the artifact bucket. The instance may read only
      objects under <prefix>/.

Rules:
  NoOpenInboundCidr:
    Assertions:
      - Assert: !Not [!Equals [!Ref AllowedInboundCidr, "0.0.0.0/0"]]
        AssertDescription: AllowedInboundCidr must not be 0.0.0.0/0.
  # Rule mode and listener mode never mix (Platform spec - Base path, BP-D7).
  RuleModeIsComplete:
    RuleCondition: !Not [!Equals [!Ref ExistingAlbListenerArn, ""]]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingAlbArn, ""]]
        AssertDescription: ExistingAlbListenerArn requires ExistingAlbArn.
      - Assert: !Not [!Equals [!Ref AlbRulePriority, ""]]
        AssertDescription: ExistingAlbListenerArn requires AlbRulePriority.
      - Assert: !Not [!Equals [!Ref BasePath, ""]]
        AssertDescription: ExistingAlbListenerArn requires BasePath (an empty prefix would make the rule match every path).
      - Assert: !Equals [!Ref AlbCertificateArn, ""]
        AssertDescription: ExistingAlbListenerArn and AlbCertificateArn cannot be set together (rule mode adds no listener or certificate).

Conditions:
  HasInboundCidr: !Not [!Equals [!Ref AllowedInboundCidr, ""]]
  IsArm64: !Equals [!Ref InstanceArchitecture, arm64]
  HasAlb: !Not [!Equals [!Ref ExistingAlbArn, ""]]
  HasAlbCertificate: !Not [!Equals [!Ref AlbCertificateArn, ""]]
  IsRuleMode: !Not [!Equals [!Ref ExistingAlbListenerArn, ""]]
  IsListenerMode: !And
    - !Condition HasAlb
    - !Not [!Condition IsRuleMode]
  HasArtifactBucket: !Not [!Equals [!Ref ArtifactBucketName, ""]]
  HasAlbInboundCidr: !And
    - !Condition IsListenerMode
    - !Not [!Equals [!Ref AlbAllowedInboundCidr, ""]]

Resources:
  # Deleting the stack deletes this repository AND every image in it
  # (EmptyOnDelete). No Retain policy on purpose.
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images ${UntaggedImageRetentionDays} days after push",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedImageRetentionDays}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the most recent image tagged latest",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["latest"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              }
            ]
          }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: LLM Usage Lens POC instance - Session Manager, ECR pull and optional S3 artifact read.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ecr-pull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrAuthToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPullThisRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !GetAtt EcrRepository.Arn
        # Read-only, and only under the prefix: config.yaml and the Compose
        # binary (poc/README.md - S3 artifact bucket).
        - !If
          - HasArtifactBucket
          - PolicyName: s3-artifacts-read
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadArtifacts
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}/${ArtifactKeyPrefix}/*
                - Sid: ListArtifactPrefix
                  Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucketName}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - !Sub ${ArtifactKeyPrefix}/*
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LLM Usage Lens POC instance - no SSH, optional app port from one trusted CIDR
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - HasInboundCidr
        - - IpProtocol: tcp
            FromPort: !Ref AppPort
            ToPort: !Ref AppPort
            CidrIp: !Ref AllowedInboundCidr
            Description: Application port from the trusted CIDR
        - !Ref AWS::NoValue
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Outbound to SSM, ECR, S3, package repositories and the external LiteLLM endpoint
      Tags:
        - Key: Name
          Value: !Sub ${InstanceName}-sg

  # Optional: publish the app through an EXISTING load balancer. The stack
  # creates the target group, a NEW security group for the load balancer and
  # either a listener (listener mode) or one rule on an existing listener (rule
  # mode). It never reuses, edits or deletes the load balancer's existing
  # security groups, the load balancer itself, its listeners or its certificates.
  #
  # CloudFormation cannot attach a security group to a load balancer it does
  # not own, so AlbSecurityGroup is attached (in addition to the existing
  # groups) and detached with poc/scripts/alb-security-group.sh. Detach it
  # before deleting the stack, or the group cannot be deleted.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasAlb
    Properties:
      GroupDescription: LLM Usage Lens POC - added to the existing load balancer for the POC listener
      VpcId: !Ref VpcId
      # Placeholder that replaces the default allow-all egress rule; the only
      # real egress is AlbToInstanceEgress below.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: Placeholder - no general outbound traffic through this group
      Tags:
        - Key: Name
          Value: !Sub ${InstanceName}-alb-sg

  AlbListenerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAlbInboundCidr
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AlbListenerPort
      ToPort: !Ref AlbListenerPort
      CidrIp: !Ref AlbAllowedInboundCidr
      Description: POC listener port from the allowed CIDR

  AlbToInstanceEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasAlb
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      DestinationSecurityGroupId: !Ref InstanceSecurityGroup
      Description: Application port and health check to the POC instance

  AlbToInstanceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAlb
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref AppPort
      ToPort: !Ref AppPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Application port and health check from the POC load balancer security group

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: HasAlb
    Properties:
      VpcId: !Ref VpcId
      TargetType: instance
      Protocol: HTTP
      Port: !Ref AppPort
      Targets:
        - Id: !Ref Instance
          Port: !Ref AppPort
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Sub ${BasePath}/api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: Name
          Value: !Sub ${InstanceName}-tg

  # Rule mode: the app owns the prefix, so the rule forwards the request
  # unchanged. Two patterns, never BasePath* (BP-D4).
  AlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: IsRuleMode
    Properties:
      ListenerArn: !Ref ExistingAlbListenerArn
      Priority: !Ref AlbRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - !Ref BasePath
              - !Sub ${BasePath}/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: IsListenerMode
    Properties:
      LoadBalancerArn: !Ref ExistingAlbArn
      Port: !Ref AlbListenerPort
      Protocol: !If [HasAlbCertificate, HTTPS, HTTP]
      SslPolicy: !If
        - HasAlbCertificate
        - ELBSecurityPolicy-TLS13-1-2-2021-06
        - !Ref AWS::NoValue
      Certificates: !If
        - HasAlbCertificate
        - - CertificateArn: !Ref AlbCertificateArn
        - !Ref AWS::NoValue
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      # Latest Amazon Linux 2023 AMI for the chosen architecture. It is
      # resolved on every stack operation: a later stack update can pick a
      # newer AMI and replace the instance (and its root volume).
      ImageId: !If
        - IsArm64
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
        - "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref InstanceName
      # Host prerequisites only: no credentials, no secrets, no image pull and
      # no application start.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          systemctl enable --now docker

          # Preinstalled on Amazon Linux 2023 AMIs; this keeps it present and running.
          dnf install -y amazon-ssm-agent
          systemctl enable --now amazon-ssm-agent

          # Compose plugin: the Amazon Linux package, else the release binary
          # from the artifact bucket (poc/README.md - Install Docker Compose
          # from S3), else from GitHub. Each source is checked against its
          # .sha256 file. A host without any of them still finishes booting;
          # install Compose by hand as the README describes.
          install_compose() {
            local plugin_dir=/usr/libexec/docker/cli-plugins
            local asset="docker-compose-linux-$(uname -m)"
            local bucket="${ArtifactBucketName}"
            local s3_base="s3://$bucket/${ArtifactKeyPrefix}/compose/${ComposeVersion}"
            local gh_base="https://github.com/docker/compose/releases/download/${ComposeVersion}"
            dnf install -y docker-compose-plugin && return 0
            mkdir -p "$plugin_dir"
            cd "$(mktemp -d)"
            if [[ -n "$bucket" ]] &&
              aws s3 cp --only-show-errors "$s3_base/$asset" . &&
              aws s3 cp --only-show-errors "$s3_base/$asset.sha256" .; then
              :
            else
              curl -fsSL --retry 5 -o "$asset" "$gh_base/$asset" || return 1
              curl -fsSL --retry 5 -o "$asset.sha256" "$gh_base/$asset.sha256" || return 1
            fi
            sha256sum -c "$asset.sha256" || return 1
            install -m 0755 "$asset" "$plugin_dir/docker-compose"
          }
          install_compose || echo "Docker Compose not installed: see poc/README.md - Install Docker Compose from S3"
          docker compose version || true

          install -d -m 0750 /opt/llm-usage-lens-poc

Outputs:
  InstanceId:
    Description: EC2 instance ID (Session Manager target).
    Value: !Ref Instance
  InstancePrivateIp:
    Description: Private IPv4 address of the instance.
    Value: !GetAtt Instance.PrivateIp
  InstanceSecurityGroupId:
    Description: Security group of the instance (allow it on the LiteLLM side if required).
    Value: !Ref InstanceSecurityGroup
  EcrRepositoryUri:
    Description: ECR repository URI (without tag).
    Value: !GetAtt EcrRepository.RepositoryUri
  EcrRepositoryName:
    Description: ECR repository name.
    Value: !Ref EcrRepository
  ImagePlatform:
    Description: Docker platform the image must be built for.
    Value: !Sub
      - linux/${Arch}
      - Arch: !If [IsArm64, arm64, amd64]
  AppPort:
    Description: Host port the application is published on.
    Value: !Ref AppPort
  AlbArn:
    Condition: HasAlb
    Description: The existing load balancer the listener or rule was added to (not owned by this stack).
    Value: !Ref ExistingAlbArn
  AlbSecurityGroupId:
    Condition: HasAlb
    Description: New security group to attach to the existing load balancer (poc/scripts/alb-security-group.sh attach).
    Value: !Ref AlbSecurityGroup
  AlbListenerArn:
    Condition: IsListenerMode
    Description: Listener added to the existing load balancer (listener mode).
    Value: !Ref AlbListener
  AlbListenerRuleArn:
    Condition: IsRuleMode
    Description: Rule added to the existing listener (rule mode).
    Value: !Ref AlbListenerRule
  AlbTargetGroupArn:
    Condition: HasAlb
    Description: Target group that forwards to the instance on AppPort.
    Value: !Ref AlbTargetGroup
  ArtifactBucketName:
    Condition: HasArtifactBucket
    Description: S3 bucket the instance may read (under ArtifactKeyPrefix).
    Value: !Ref ArtifactBucketName
  ArtifactKeyPrefix:
    Condition: HasArtifactBucket
    Description: Key prefix the instance may read in the artifact bucket.
    Value: !Ref ArtifactKeyPrefix
  Region:
    Description: AWS region of the stack.
    Value: !Ref AWS::Region
  AccountId:
    Description: AWS account ID of the stack.
    Value: !Ref AWS::AccountId
