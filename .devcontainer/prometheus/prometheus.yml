global:
  # Tight interval keeps the local Grafana dashboard responsive (dev-only).
  scrape_interval: 5s

scrape_configs:
  # Single job: scrape the metrics the OTel Collector exposes on :8889
  # (set by the `prometheus` exporter in otel/otel-collector-config.yaml).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]