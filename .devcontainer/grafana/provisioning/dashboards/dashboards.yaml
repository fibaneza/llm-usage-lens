# Auto-load any dashboard JSON in the provisioning dir into a "Claude Code"
# folder, re-checking every 30s so edits to claude-code.json show up live.
apiVersion: 1

providers:
  - name: default
    folder: Claude Code
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
