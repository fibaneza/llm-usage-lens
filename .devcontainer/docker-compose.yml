services:
  app:
    # Built from .devcontainer/Dockerfile — installs the Claude Code CLI and
    # renames the container user to match the host user (USERNAME build arg).
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Host login name — interpolated from the shell env, not hardcoded.
        USERNAME: ${USER:-node}
        PROJECT_FOLDER_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ..:/workspace/${COMPOSE_PROJECT_NAME}:cached
      # Persist the whole container home in a named volume so the globally
      # installed Claude Code CLI, the plugins added by post-create.sh, and
      # ~/.claude state (settings + claude-mem observations) all survive image
      # rebuilds — without binding to the host's own home directory.
      # Note: a persisted home shadows later image changes under /home; remove
      # the volume (`docker compose down -v`) to re-seed from a fresh build.
      - user-home-data:/home/${USER:-node}
    command: sleep infinity
    environment:
      PROJECT_FOLDER_NAME: ${COMPOSE_PROJECT_NAME}
      OTEL_SERVICE_NAME: llm-usage-lens

      # Git config
      GIT_USER_NAME: ${GIT_USER_NAME:-"Dev User"}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-"dev@example.com"}

      # Claude Code telemetry — exports metrics + events when `claude` runs
      # inside this container. See docs/guides or code.claude.com/docs/en/monitoring-usage.
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_DEFAULT_ENDPOINT}
      # Prometheus needs cumulative counters; Claude Code defaults to delta.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      OTEL_METRIC_EXPORT_INTERVAL: "10000"

      # SSO profile — set AWS_PROFILE in .devcontainer/.env; used by aws/sam CLI inside the container.
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_REGION: ap-southeast-2

      # DynamoDB Local endpoint — the app overrides the SDK endpoint with this value.
      # Dummy keys are NOT set here: AWS_ACCESS_KEY_ID/SECRET in the container env would
      # override SSO credentials for all aws CLI calls. Set them in apps/dashboard/.env.local
      # if the app's DynamoDB client requires non-empty values against DynamoDB Local.
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    depends_on:
      - otel-collector
    healthcheck:
      test: [ "CMD", "node", "-v" ]
      interval: 30s
      timeout: 10s
      retries: 5

  dynamodb-local:
    # Optional — start on demand: `docker compose up -d dynamodb-local` or via /seed
    # image: amazon/dynamodb-local:2.5.4
    image: amazon/dynamodb-local:latest
    user: root
    command: [ "-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data" ]
    volumes:
      - dynamodb-data:/data
    ports:
      - "8000:8000"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      - dynamodb-local

  otel-collector:
    # image: otel/opentelemetry-collector-contrib:0.107.0
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otelcol/config.yaml" ]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: [ "CMD", "otelcol-contrib", "--version" ]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    # image: prom/prometheus:v2.54.1
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 5

  loki:
    # image: grafana/loki:3.1.2
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3100/ready" ]
      interval: 30s
      timeout: 10s
      retries: 5

  grafana:
    # image: grafana/grafana:11.2.2
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    secrets:
      - grafana_admin_password
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

secrets:
  # Gitignored, local-only. Seeded from grafana_admin_password.txt.example on
  # first start by devcontainer.json's initializeCommand. Running the stack
  # outside the devcontainer? Copy the .example to this path first.
  grafana_admin_password:
    file: ./grafana/grafana_admin_password.txt

volumes:
  dynamodb-data: # DynamoDB Local table data
  user-home-data: # Container home (~/) — see the note on the app service's volumes
