version: 2
updates:
  # Keep GitHub Actions versions pinned and up-to-date.
  # The dashboard's npm ecosystem block is added in Phase 1 once its
  # package.json exists; the standalone simulator already has one (below).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
    # `prefix` is prepended to the PR title so it passes pr-title-lint
    # (Conventional Commits — the squash-merge commit on `main`).
    commit-message:
      prefix: "chore"
    # All GitHub Actions bumps (including majors) in one PR per week.
    # Actions major bumps are typically backward-compatible for this project's
    # usage patterns; a single grouped PR is easier to review than 5+ individual ones.
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"

  # bedrock-simulator (standalone pnpm package — not in the dashboard workspace).
  # Dependabot's "npm" ecosystem reads its pnpm-lock.yaml. This complements the
  # advisory bedrock-simulator-deps.yml workflow: Dependabot opens upgrade PRs
  # within semver ranges (plus out-of-cycle security PRs); the workflow only
  # surfaces drift in a comment.
  - package-ecosystem: "npm"
    directory: "/tools/bedrock-simulator"
    schedule:
      interval: "weekly"
    labels:
      - "type: chore"
    commit-message:
      prefix: "chore"
      include: "scope"
    # All simulator dependency bumps in one PR per week, including majors.
    # Security updates still arrive as out-of-cycle individual PRs (Dependabot
    # always separates security fixes regardless of group configuration).
    groups:
      simulator-all:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
