name: Node setup
description: Installs pnpm and Node.js with pnpm store caching. Used in dashboard CI jobs.

inputs:
  node-version:
    required: false
    description: Node.js version to install.
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
