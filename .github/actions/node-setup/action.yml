name: Node setup
description: Installs pnpm and Node.js with pnpm store caching. Used in dashboard CI jobs.

inputs:
  node-version:
    required: false
    description: Node.js version to install.
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
