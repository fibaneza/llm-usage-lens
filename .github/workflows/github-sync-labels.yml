name: "Github: chore - sync labels"

# Applies .github/github-sync-labels.yml to the repository's labels. Create/update only —
# no skip-delete keeps labels created out-of-band (the release audit's security /
# severity / code-review labels) from being removed. Runs on push to main when
# the definitions or this workflow change, and on demand.

on:
  push:
    branches: [main]
    paths:
      - ".github/github-sync-labels.yml"
      - ".github/workflows/github-sync-labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync labels from .github/github-sync-labels.yml
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/github-sync-labels.yml
          skip-delete: true
          dry-run: false
