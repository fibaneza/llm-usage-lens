# bedrock-simulator-destroy.yml
#
# Two-phase teardown of the bedrock-simulator stack:
#   1. Disable account-level Bedrock model invocation logging (otherwise the
#      bucket and log group can't be deleted — they're referenced by an
#      account-level setting CloudFormation doesn't own).
#   2. Empty InvocationLoggingBucket so CloudFormation can delete the bucket.
#   3. sam delete --no-prompts.
#
# If the stack still lands in DELETE_FAILED, follow Recovery D in
# docs/guides/bedrock-simulator.md.
#
# All untrusted/external inputs are passed via `env:` blocks (never inlined in
# `run:` strings) to prevent shell-command injection.
#
# Steps:
#   1. Confirm intent (dispatch input must equal "destroy bedrock-simulator")
#   2. Checkout + set up AWS SAM CLI
#   3. Configure AWS credentials via OIDC
#   4. Get InvocationLoggingBucketName from CFN outputs
#   5. Disable Bedrock model invocation logging (idempotent)
#   6. Empty InvocationLoggingBucket
#   7. SAM delete
#   8. Verify stack deleted
#   9. On failure: capture CloudFormation events as artifact

name: bedrock-simulator destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the literal string "destroy bedrock-simulator" to confirm teardown.'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  STACK_NAME: bedrock-simulator
  CONFIRM_STRING: 'destroy bedrock-simulator'

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Tear down stack
    runs-on: ubuntu-latest
    environment: bedrock-simulator-sandbox

    steps:
      - name: Confirm intent
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$CONFIRM_STRING" ]; then
            echo "::error::confirm input must be the literal string defined by CONFIRM_STRING."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/aws-configure-oidc
        with:
          role-arn: arn:aws:iam::${{ vars.SANDBOX_ACCOUNT_ID }}:role/bedrock-simulator-deployer
          aws-region: ${{ env.AWS_REGION }}

      - name: Get InvocationLoggingBucketName from CFN outputs
        id: outputs
        run: |
          set -euo pipefail
          # Stack may already be partially deleted (Recovery D from
          # bedrock-simulator.md). Discard CLI errors but keep the empty-bucket
          # warning so the operator sees why subsequent emptying is a no-op.
          BUCKET_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='InvocationLoggingBucketName'].OutputValue" \
            --output text 2>/dev/null || echo "")
          if [ -z "$BUCKET_NAME" ] || [ "$BUCKET_NAME" = "None" ]; then
            echo "::warning::Could not resolve InvocationLoggingBucketName — stack may already be partially deleted. Continuing."
            BUCKET_NAME=""
          fi
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"

      - name: Disable Bedrock model invocation logging (idempotent)
        run: |
          set +e
          aws bedrock delete-model-invocation-logging-configuration 2>&1 | tee /tmp/mil-delete.log
          RC=$?
          if [ $RC -ne 0 ]; then
            if grep -q "ResourceNotFoundException" /tmp/mil-delete.log; then
              echo "Model invocation logging already disabled — no-op."
            else
              echo "::warning::delete-model-invocation-logging-configuration failed; continuing with destroy."
            fi
          else
            echo "Model invocation logging disabled."
          fi
          set -e

      - name: Empty InvocationLoggingBucket
        uses: ./.github/actions/aws-s3-bucket-empty
        with:
          bucket-name: ${{ steps.outputs.outputs.bucket_name }}
          region: ${{ env.AWS_REGION }}

      - name: SAM delete
        run: sam delete --stack-name "$STACK_NAME" --region "$AWS_REGION" --no-prompts

      - name: Verify stack deleted
        run: |
          set +e
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ] && echo "$STATUS" | grep -q "does not exist"; then
            echo "Stack '$STACK_NAME' deleted successfully."
          else
            echo "::error::Stack still exists with status: $STATUS. See Recovery D in docs/guides/bedrock-simulator.md."
            exit 1
          fi

      - name: Capture diagnostics on failure
        if: failure()
        uses: ./.github/actions/aws-capture-diagnostics
        with:
          stack-name: ${{ env.STACK_NAME }}
          artifact-name: bedrock-simulator-destroy-diagnostics
          region: ${{ env.AWS_REGION }}
