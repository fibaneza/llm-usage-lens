# bedrock-simulator-bootstrap.yml
#
# ONE-TIME bootstrap workflow. Solves the chicken-and-egg problem:
# bedrock-simulator-deploy.yml assumes the bedrock-simulator-deployer OIDC
# role, but that role is created BY the CloudFormation stack. This workflow
# breaks the cycle by deploying the full stack once using temporary static
# IAM credentials, after which all future deploys use OIDC.
#
# Prerequisites (do these before running this workflow):
#   1. Create a temporary IAM user in account SANDBOX_ACCOUNT_ID with
#      AdministratorAccess. Generate an access key pair.
#   2. Store the key pair as GitHub Actions secrets (repo or environment level):
#        BOOTSTRAP_AWS_ACCESS_KEY_ID
#        BOOTSTRAP_AWS_SECRET_ACCESS_KEY
#   3. Run bedrock-simulator-build.yml on main first to produce a build artifact.
#   4. Trigger this workflow, passing the build run ID.
#
# After this workflow succeeds:
#   - Delete the temporary IAM user and its access keys immediately.
#   - Remove BOOTSTRAP_AWS_ACCESS_KEY_ID and BOOTSTRAP_AWS_SECRET_ACCESS_KEY
#     from GitHub Actions secrets — they are never needed again.
#   - Use bedrock-simulator-deploy.yml for all subsequent deploys (OIDC only).
#
# Security note: static credentials violate Rule 50.1 in normal operation.
# This workflow is the documented one-time exception. The credentials must be
# scoped to the sandbox account only and deleted within minutes of the workflow
# completing.

name: "ops: bedrock-simulator bootstrap (one-time)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm this one-time static-credential deploy.'
        required: true
        type: string
      build_run_id:
        description: 'Run ID of a successful bedrock-simulator-build.yml run (leave blank for latest on main).'
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1
  STACK_NAME: bedrock-simulator

# Serialize with all other stack-mutating workflows.
concurrency:
  group: bedrock-simulator-stack
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap IAM prerequisites + deploy stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: bedrock-simulator-sandbox
    permissions:
      contents: read
      actions: read

    steps:
      - name: Validate confirm input
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "bootstrap" ]; then
            echo "::error::confirm must be the literal string 'bootstrap'."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Configure AWS credentials (temporary bootstrap keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify credentials resolve to the sandbox account
        env:
          EXPECTED_ACCOUNT: ${{ vars.SANDBOX_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACTUAL=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACTUAL" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Credentials resolve to account $ACTUAL, expected $EXPECTED_ACCOUNT."
            echo "::error::Check that BOOTSTRAP_AWS_ACCESS_KEY_ID / BOOTSTRAP_AWS_SECRET_ACCESS_KEY belong to account $EXPECTED_ACCOUNT."
            exit 1
          fi
          echo "Account confirmed: $ACTUAL"

      - name: Create GitHub OIDC identity provider (if missing)
        run: |
          set -euo pipefail
          OIDC_ARN=$(aws iam list-open-id-connect-providers \
            --query 'OpenIDConnectProviderList[?contains(Arn,`token.actions.githubusercontent.com`)].Arn' \
            --output text)
          if [ -z "$OIDC_ARN" ]; then
            echo "OIDC IdP not found — creating..."
            aws iam create-open-id-connect-provider \
              --url https://token.actions.githubusercontent.com \
              --client-id-list sts.amazonaws.com \
              --thumbprint-list \
                6938fd4d98bab03faadb97b34396831e3780aea1 \
                1c58a3a8518e8759bf075b76b750d4f2df264fcd
            echo "OIDC IdP created."
          else
            echo "OIDC IdP already exists: $OIDC_ARN"
          fi

      - name: Resolve + fetch build bundle
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="$BUILD_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            echo "No build_run_id supplied — resolving latest successful build on main."
            RUN_ID=$(gh run list --workflow bedrock-simulator-build.yml --branch main \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' \
              --repo "$GITHUB_REPOSITORY")
            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful bedrock-simulator-build run found on main. Run the build workflow first."
              exit 1
            fi
          fi
          echo "Downloading artifact from build run $RUN_ID"
          gh run download "$RUN_ID" --name sam-build --repo "$GITHUB_REPOSITORY" \
            || { echo "::error::Could not download artifact from run $RUN_ID — it may have expired (7-day retention). Re-run the build workflow."; exit 1; }

          tar xzf sam-build.tgz -C tools/bedrock-simulator
          if [ ! -f tools/bedrock-simulator/.aws-sam/build/template.yaml ]; then
            echo "::error::Bundle did not contain .aws-sam/build/template.yaml."
            exit 1
          fi

      - name: Show build provenance
        run: |
          set -euo pipefail
          INFO=tools/bedrock-simulator/.aws-sam/BUILD_INFO.txt
          {
            echo "## Bedrock simulator bootstrap deploy"
            echo ""
            if [ -f "$INFO" ]; then
              echo "Deploying build:"
              echo ""
              echo '```'
              cat "$INFO"
              echo '```'
            else
              echo "_No BUILD_INFO.txt in the bundle._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy full stack (creates bedrock-simulator-deployer role)
        uses: ./.github/actions/aws-sam-deploy
        with:
          stack-name: ${{ env.STACK_NAME }}
          region: ${{ env.AWS_REGION }}
          working-directory: tools/bedrock-simulator
          parameters: |
            SandboxAccountId=${{ vars.SANDBOX_ACCOUNT_ID }}
            GitHubOwner=${{ github.repository_owner }}
            GitHubRepo=${{ github.event.repository.name }}
            GitHubEnvironment=bedrock-simulator-sandbox
            BudgetAlertEmail=${{ secrets.BUDGET_ALERT_EMAIL }}

      - name: Verify stack status
        run: |
          set -euo pipefail
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' --output text)
          echo "Stack status: $STATUS"
          if [ "$STATUS" != "CREATE_COMPLETE" ] && [ "$STATUS" != "UPDATE_COMPLETE" ]; then
            echo "::error::Stack status is $STATUS — expected CREATE_COMPLETE or UPDATE_COMPLETE."
            exit 1
          fi

      - name: Post-bootstrap checklist
        run: |
          {
            echo "## Bootstrap complete — action required"
            echo ""
            echo "### Delete the temporary credentials NOW"
            echo ""
            echo "The bootstrap IAM user has \`AdministratorAccess\` to the sandbox account."
            echo "Delete it immediately:"
            echo ""
            echo '```bash'
            echo "# Find and delete the access key"
            echo "aws iam delete-access-key \\"
            echo "  --user-name <bootstrap-user-name> \\"
            echo "  --access-key-id ${{ vars.SANDBOX_ACCOUNT_ID && 'AKIAIOSFODNN7EXAMPLE' || 'BOOTSTRAP_KEY_ID' }}"
            echo ""
            echo "# Delete the user"
            echo "aws iam delete-user --user-name <bootstrap-user-name>"
            echo '```'
            echo ""
            echo "Then remove \`BOOTSTRAP_AWS_ACCESS_KEY_ID\` and \`BOOTSTRAP_AWS_SECRET_ACCESS_KEY\`"
            echo "from the repository / environment secrets in GitHub."
            echo ""
            echo "### Remaining one-time steps"
            echo ""
            echo "- [ ] Confirm the AWS Budget SNS email subscription (check inbox, click the link)."
            echo "- [ ] Verify CloudTrail captures Bedrock data events (Prerequisite #6 in the guide)."
            echo ""
            echo "### Future deploys"
            echo ""
            echo "Use \`bedrock-simulator-deploy.yml\` — it authenticates via OIDC using the"
            echo "\`bedrock-simulator-deployer\` role this workflow just created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture diagnostics on failure
        if: failure()
        uses: ./.github/actions/aws-capture-diagnostics
        with:
          stack-name: ${{ env.STACK_NAME }}
          artifact-name: bedrock-simulator-bootstrap-diagnostics
          region: ${{ env.AWS_REGION }}
