name: "llm-usage-lens: ci - build"

# Pipeline: quality + test + build. The test job (Vitest) landed in Phase 3.1 and
# gained DynamoDB Local in Phase 3.2; deploy-collector arrives in Phase 6.
# Source: docs/specs/2026-05-15-implementation-phases.md §CI/CD — GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become ready" >&2
          exit 1
      - name: Create table
        run: pnpm db:create-table
      # Smoke check on `bedrock-usage`; tests use a per-run `bedrock-usage-test-<pid>` table.
      - name: Seed (smoke)
        run: pnpm db:seed
      - name: Test
        run: pnpm exec vitest run

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # build:ci supplies non-secret placeholders so @t3-oss/env-nextjs
        # validates the env schema (defaults and the sign-in provider checks)
        # instead of being skipped (Rule 50.2).
        run: pnpm build:ci
