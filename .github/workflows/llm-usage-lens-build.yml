name: "llm-usage-lens: ci - build"

# Pipeline: quality + test + build + e2e + e2e-dev (the dev-login specs on
# next dev; .github/ACTIONS.md). The test job (Vitest) landed in Phase 3.1 and
# gained DynamoDB Local in Phase 3.2; deploy-collector arrives in Phase 6.
# Source: docs/specs/2026-05-15-implementation-phases.md §CI/CD — GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs only; a push to main never cancels
  # the main run in progress, so every main run completes (.github/ACTIONS.md).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become ready" >&2
          exit 1
      - name: Create table
        run: pnpm db:create-table
      # Smoke check on `bedrock-usage`; tests use their own `bedrock-usage-test-<pid>-*` tables, one per integration file.
      - name: Seed (smoke)
        run: pnpm db:seed
      - name: Test
        run: pnpm exec vitest run

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        # build:ci supplies non-secret placeholders so @t3-oss/env-nextjs
        # validates the env schema (defaults and the sign-in provider checks)
        # instead of being skipped (Rule 50.2).
        run: pnpm build:ci

  # Source: docs/specs/2026-05-15-implementation-phases.md Phase 5 — Add Playwright to GitHub Actions CI.
  e2e:
    name: e2e
    needs: [quality]
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.60 cannot
    # install Chromium (run 43878743673). Revisit on a Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      E2E_LOCK: "off"
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node setup
        uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/dashboard/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become ready" >&2
          exit 1
      - name: Create table
        run: pnpm db:create-table
      - name: Seed
        run: pnpm db:seed
      - name: E2E
        run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts
          path: |
            apps/dashboard/test-results
            apps/dashboard/playwright-report
          retention-days: 7

  # The e2e job serves production builds, which refuse the dev-only login, so
  # the specs that need it run here on `next dev` (.github/ACTIONS.md).
  e2e-dev:
    name: e2e-dev
    needs: [quality]
    # Same pin as e2e (run 43878743673).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      E2E_LOCK: "off"
      E2E_SERVERS: dev
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node setup
        uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./apps/dashboard/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browser
        working-directory: apps/dashboard
        run: pnpm exec playwright install --with-deps chromium
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not become ready" >&2
          exit 1
      - name: Create table
        run: pnpm db:create-table
      - name: Seed
        run: pnpm db:seed
      - name: E2E (dev-login specs)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-dev-report.json
        run: pnpm test:e2e e2e/dev-login.spec.ts e2e/sign-in-role-choice.spec.ts e2e/settings-tabs.spec.ts --grep "dev-only local login|dev login identity option|local login role choice|step-up returns to the right tab"
      # Fails unless exactly the 12 dev-login cases ran, none skipped.
      - name: Assert dev-login case count
        run: pnpm exec tsx scripts/e2e-assert-count-cli.ts ${{ runner.temp }}/e2e-dev-report.json 12
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-dev
          path: |
            apps/dashboard/test-results
            apps/dashboard/playwright-report
          retention-days: 7
