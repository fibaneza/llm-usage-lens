# claude-pr-review.yml
#
# Automated code and security review for every non-draft pull request.
# Skips doc-only PRs (paths-ignore). Cancels stale runs when a new push
# arrives (concurrency cancel-in-progress).
#
# Three review modes driven by scope detection:
#   full + security  — opened/reopened/ready events touching sensitive paths
#   full code-only   — opened/reopened/ready events on non-sensitive paths
#   incremental      — subsequent pushes (synchronize events) scoped to changed files
#
# After any full+security review, HIGH findings trigger a PR comment and a
# REQUEST_CHANGES review submission.
#
# Steps:
#   1. Checkout (shallow)
#   2. Load sensitive-paths regex from lib/sensitive-paths.sh
#   3. Determine PR scope (full vs incremental, security-relevant flag)
#   4. Full review: code + security  (conditional)
#   5. Full review: code only        (conditional)
#   6. Incremental review            (conditional)
#   7. Post security findings comment + REQUEST_CHANGES if HIGH > 0

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      id-token: write # Required: claude-code-action performs an OIDC token exchange on startup
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      # Single source of truth for the tools the review agent may use.
      # Drift across the three review modes below caused subtle behaviour
      # differences in earlier iterations — keep them identical here.
      REVIEW_TOOLS: 'Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Load sensitive-paths regex
        id: regex
        run: |
          source .github/scripts/claude/lib/sensitive-paths.sh
          echo "value=$SENSITIVE" >> "$GITHUB_OUTPUT"

      - name: Determine PR scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SENSITIVE: ${{ steps.regex.outputs.value }}
        run: bash .github/scripts/claude/pr-determine-scope.sh

      - name: Full review (code + security)
        id: full
        if: steps.scope.outputs.type == 'full' && steps.scope.outputs.security_relevant == 'true'
        uses: ./.github/actions/github-review
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          max-turns: 8
          allowed-tools: ${{ env.REVIEW_TOOLS }}
          plugin-marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Then audit for security (OWASP Top 10 + project-specific):
            - Hardcoded secrets, API keys, credentials
            - Missing Auth.js session checks in Route Handlers (must return 401)
            - Server-only boundary violations: `@aws-sdk/*` or DynamoDB client in client/shared code
            - Static AWS keys (project uses SSO + AWS_PROFILE — Rule 50)
            - Secrets in logs or telemetry
            - Vulnerable dependencies introduced by this PR

            Severity: HIGH = directly exploitable; MEDIUM = exploitable under specific conditions; LOW = best-practice.

            Output format:
            - Post every finding (correctness + security, all severities) as an inline review comment via mcp__github_inline_comment__create_inline_comment, anchored to the specific file and line in the diff.
            - When a concrete fix is obvious (single-line or small-block replacement), the inline comment body must include a GitHub suggestion block so the author can click Apply suggestion or Add suggestion to batch:
              ```suggestion
              <replacement code>
              ```
            - LOW severity findings appear only as inline comments (with suggestion blocks where applicable) — do NOT include LOW findings in the security-summary block below.

            End your response with this exact fenced block (no prose after):

            ```security-summary
            HIGH: <count>
            MEDIUM: <count>
            LOW: <count>
            HIGH_FINDINGS:
            - <one-line per HIGH, or "none" if 0>
            MEDIUM_FINDINGS:
            - <one-line per MEDIUM, or "none" if 0>
            ```

      - name: Full review (code only)
        id: full_code_only
        if: steps.scope.outputs.type == 'full' && steps.scope.outputs.security_relevant == 'false'
        uses: ./.github/actions/github-review
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          max-turns: 8
          allowed-tools: ${{ env.REVIEW_TOOLS }}
          plugin-marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Output format:
            - Post every finding (correctness, all severities) as an inline review comment via mcp__github_inline_comment__create_inline_comment, anchored to the specific file and line in the diff.
            - When a concrete fix is obvious (single-line or small-block replacement), the inline comment body must include a GitHub suggestion block so the author can click Apply suggestion or Add suggestion to batch:
              ```suggestion
              <replacement code>
              ```

      - name: Incremental review (latest push only)
        id: incremental
        if: steps.scope.outputs.type == 'incremental'
        uses: ./.github/actions/github-review
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: claude-sonnet-4-6
          max-turns: 5
          allowed-tools: ${{ env.REVIEW_TOOLS }}
          plugin-marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Output format:
            - Post every finding (correctness, all severities) as an inline review comment via mcp__github_inline_comment__create_inline_comment, anchored to the specific file and line in the diff.
            - When a concrete fix is obvious (single-line or small-block replacement), the inline comment body must include a GitHub suggestion block so the author can click Apply suggestion or Add suggestion to batch:
              ```suggestion
              <replacement code>
              ```

            Scope to ONLY files changed in this push:
            ${{ steps.scope.outputs.files }}

            Skip files not in that list unless directly called by the changed code.

      - name: Comment + reject on security findings
        if: steps.scope.outputs.type == 'full' && steps.full.conclusion == 'success'
        uses: ./.github/actions/github-post-pr-security-comment
        with:
          review-output: ${{ steps.full.outputs.result }}
          pr-number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
          head-ref: ${{ github.head_ref }}
          base-ref: ${{ github.base_ref }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}
