name: "Github: ci - pr title lint"

on:
  pull_request:
    # synchronize is intentionally omitted — pushes don't change the PR title.
    types: [opened, edited, reopened]

jobs:
  lint-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types matching Conventional Commits and this repo's commitlint config.
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci
          # Allow a scope in parentheses, e.g. "feat(dashboard): …"
          requireScope: false
          # The PR title becomes the squash-merge commit on main — CC is required.
          validateSingleCommit: false
