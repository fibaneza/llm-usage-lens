# On-demand advisory report (outdated + audit + dedupe) to the run summary.
# Never fails — enforcement is the blocking audit in bedrock-simulator-build.yml.
# Touches no AWS.

name: "bedrock-simulator: ci - deps"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: Dependency health report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '9'

      - name: Install simulator dependencies
        working-directory: tools/bedrock-simulator
        run: pnpm install --frozen-lockfile

      - name: Dependency health report
        working-directory: tools/bedrock-simulator
        run: |
          {
            echo "## bedrock-simulator dependency health"
            echo ""
            echo "### Outdated"
            echo '```'
            pnpm outdated || true
            echo '```'
            echo ""
            echo "### Security audit"
            echo '```'
            pnpm audit || true
            echo '```'
            echo ""
            echo "### Duplicate versions"
            if pnpm dedupe --check; then
              echo "Lockfile is flat — no duplicate versions."
            else
              echo "\`pnpm dedupe --check\` reports the lockfile could be flattened — run \`pnpm dedupe\`."
            fi
            echo ""
            echo "_Advisory only. To remediate, from \`tools/bedrock-simulator/\`: \`pnpm up --latest\` (freshness), \`pnpm up <pkg>@latest\` then re-run \`pnpm audit\` (security), \`pnpm dedupe\` (duplicates). Commit \`package.json\` + the lockfile._"
          } >> "$GITHUB_STEP_SUMMARY"
