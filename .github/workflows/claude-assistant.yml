# claude-assistant.yml
#
# On-demand Claude assistant triggered by @claude mentions on ISSUES only —
# either a newly opened/assigned issue or a comment on an issue. Pull requests
# are intentionally out of scope: PRs are covered by claude-pr-review.yml
# (automated review) and by local Claude Code. Unlike the review workflows,
# this bot responds to freeform requests — Claude interprets the triggering
# issue/comment body as its instructions (issue triage, Q&A, repro guidance).
#
# Cost discipline mirrors the review workflows: --max-turns cap and a
# read-only --allowed-tools allowlist (no Write/Edit/commit).
#
# Steps:
#   1. Checkout repository (shallow)
#   2. Run Claude Code (prompt derived from the @claude mention body)

name: Claude Assistant

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # `issue_comment` fires on PR comments too — `!github.event.issue.pull_request`
    # restricts this job to real issues, keeping PRs out of scope.
    if: |
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Cost caps: bound the turn count and restrict to read-only tools plus
          # issue interaction. No Write/Edit/Bash beyond `gh issue`.
          claude_args: '--max-turns 10 --allowed-tools "Read,Glob,Grep,Bash(gh issue:*)"'

          # Prompt is intentionally unset — Claude follows the instructions in the
          # issue/comment that mentioned @claude.

