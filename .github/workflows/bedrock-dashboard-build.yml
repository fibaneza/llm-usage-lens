name: "bedrock-dashboard: ci - build"

# Pipeline: quality + test + build. The test job (Vitest) landed in Phase 3.1 and
# gained DynamoDB Local in Phase 3.2; deploy-collector arrives in Phase 6.
# Source: docs/specs/2026-05-15-implementation-phases.md §CI/CD — GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      # Dummy values DynamoDB Local requires - not real AWS keys (Rule 50.1).
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Create table
        run: pnpm db:create-table
      - name: Seed (smoke)
        run: pnpm db:seed
      - name: Test
        run: pnpm exec vitest run

  build:
    name: build
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No secrets in CI; real deployments leave this unset so @t3-oss/env-nextjs
      # fails the build on missing vars (Rule 50.2).
      SKIP_ENV_VALIDATION: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/node-setup
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
