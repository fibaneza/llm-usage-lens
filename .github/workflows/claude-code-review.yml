name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts never trigger work — saves runner time and Claude tokens.
    # `ready_for_review` re-enters this job when the PR is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: none
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Determine scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # synchronize with a real base → incremental correctness only.
          # Everything else (opened/reopened/ready_for_review/force-push) → full
          # correctness + security in a single Claude invocation.
          if [[ "$EVENT_ACTION" == "synchronize" && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            FILES=$(gh api "repos/${REPO}/compare/${EVENT_BEFORE}...${CURRENT_SHA}" \
              --jq '[.files[].filename] | join(", ")' 2>/dev/null || echo "")
            echo "type=incremental" >> "$GITHUB_OUTPUT"
            echo "files=${FILES}" >> "$GITHUB_OUTPUT"
            echo "**Scope:** incremental — \`${FILES}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "type=full" >> "$GITHUB_OUTPUT"
            echo "**Scope:** full (\`${EVENT_ACTION}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Security-sensitive paths drive whether the full review's prompt
          # also includes the security audit block (and emits a
          # `security-summary` for issue creation). Derived from Rules 10/50:
          # Auth.js entry points, the server-only DynamoDB boundary, Route
          # Handlers, the collector, env/auth schemas, lockfiles, .env*, and
          # workflows. Adjust as the layout settles.
          SENSITIVE='^(apps/dashboard/(auth\.ts|middleware\.ts|app/api/|lib/data/|lib/dynamodb\.ts|lib/auth)|apps/collector/|infrastructure/|packages/shared/src/(env|auth)|.*\.env(\..+)?$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/)'
          HITS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' \
            | grep -Ec "$SENSITIVE" || true)
          if [[ "$HITS" -gt 0 ]]; then
            echo "security_relevant=true" >> "$GITHUB_OUTPUT"
            echo "**Security audit:** running (${HITS} sensitive file(s) changed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "security_relevant=false" >> "$GITHUB_OUTPUT"
            echo "**Security audit:** skipped (no sensitive paths changed)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Full event, sensitive paths: correctness + security in ONE Claude call.
      - name: Full review (code + security)
        id: full
        if: steps.scope.outputs.type == 'full' && steps.scope.outputs.security_relevant == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
            --allowed-tools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Then audit for security (OWASP Top 10 + project-specific):
            - Hardcoded secrets, API keys, credentials
            - Missing Auth.js session checks in Route Handlers (must return 401)
            - Server-only boundary violations: `@aws-sdk/*` or DynamoDB client in client/shared code
            - Static AWS keys (project uses SSO + AWS_PROFILE — Rule 50)
            - Secrets in logs or telemetry
            - Vulnerable dependencies introduced by this PR

            Severity: HIGH = directly exploitable; MEDIUM = exploitable under specific conditions; LOW = best-practice.

            Post inline comments per finding. End your response with this exact fenced block (no prose after):

            ```security-summary
            HIGH: <count>
            MEDIUM: <count>
            LOW: <count>
            HIGH_FINDINGS:
            - <one-line per HIGH, or "none" if 0>
            MEDIUM_FINDINGS:
            - <one-line per MEDIUM, or "none" if 0>
            ```

      # Full event, no sensitive paths touched: correctness only — no
      # security audit, no security-summary block (the issue-creation step
      # below sees this step skipped and stays quiet on its own).
      - name: Full review (code only)
        id: full_code_only
        if: steps.scope.outputs.type == 'full' && steps.scope.outputs.security_relevant == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
            --allowed-tools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

      # Subsequent push: scope correctness review to changed files only.
      - name: Incremental review (latest push only)
        if: steps.scope.outputs.type == 'incremental'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          claude_args: |
            --max-turns 5
            --model claude-sonnet-4-6
            --allowed-tools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

            Scope to ONLY files changed in this push:
            ${{ steps.scope.outputs.files }}

            Skip files not in that list unless directly called by the changed code.

      - name: Create issues for security findings
        if: steps.scope.outputs.type == 'full' && steps.full.conclusion == 'success'
        uses: actions/github-script@v7
        env:
          REVIEW_OUTPUT: ${{ steps.full.outputs.result }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = process.env.REVIEW_OUTPUT ?? '';
            const block = output.match(/```security-summary\n([\s\S]*?)```/);
            if (!block) {
              console.log('No security-summary block found.');
              return;
            }
            const text = block[1];

            // Ensure the shared label and the two severity labels exist (idempotent).
            for (const [name, color, description] of [
              ['security', 'E4E669', 'Security-related issue'],
              ['high-severity', 'D93F0B', 'High severity finding'],
              ['medium-severity', 'FBCA04', 'Medium severity finding'],
            ]) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name, color, description,
                });
              } catch (_) { /* label exists */ }
            }

            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const sha = process.env.HEAD_SHA;
            const repo = process.env.REPO;
            const prUrl = `https://github.com/${repo}/pull/${prNumber}`;
            const created = [];

            const tiers = [
              { name: 'HIGH', label: 'high-severity', heading: 'High-Severity' },
              { name: 'MEDIUM', label: 'medium-severity', heading: 'Medium-Severity' },
            ];

            for (const tier of tiers) {
              const countMatch = text.match(new RegExp(`^${tier.name}:\\s*(\\d+)`, 'm'));
              const count = countMatch ? parseInt(countMatch[1], 10) : 0;
              if (count === 0) {
                console.log(`No ${tier.name} findings.`);
                continue;
              }

              const findingsRe = new RegExp(`${tier.name}_FINDINGS:\\n([\\s\\S]*?)(?=\\n[A-Z_]+:|$)`);
              const findingsMatch = text.match(findingsRe);
              const findings = findingsMatch
                ? findingsMatch[1].trim().split('\n')
                    .map(l => l.trim())
                    .filter(l => l && l !== '- none' && l !== 'none')
                : [];

              const body = [
                `## ${tier.heading} Security Findings`,
                ``,
                `**PR:** [#${prNumber}](${prUrl}) — \`${process.env.HEAD_REF}\` → \`${process.env.BASE_REF}\` @ \`${sha.slice(0, 7)}\``,
                ``,
                `### Findings (${count} ${tier.name})`,
                ...findings.map(f => `- ${f}`),
                ``,
                `Address each finding, push fixes (security re-audits on the next full event — opened/reopened/ready_for_review), then close once resolved.`,
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Security] ${tier.name} findings in PR #${prNumber} (${sha.slice(0, 7)})`,
                body,
                labels: ['security', tier.label],
                assignees: ['fibanez6'],
              });

              core.warning(`${tier.name} security issue created: ${issue.html_url}`);
              created.push({ tier: tier.name, url: issue.html_url });
            }

            if (created.length > 0) {
              const summary = core.summary.addHeading('Security Issues Created');
              for (const { tier, url } of created) {
                summary.addLink(`${tier} findings`, url);
              }
              await summary.write();
            }
