name: Claude Code Review

on:
  push:
    tags:
      - 'v*'
      - '*-rc*'
      - '*-beta*'
  workflow_dispatch:
    inputs:
      from_ref:
        description: 'Base ref to audit from (commit / tag / branch). Leave blank to auto-resolve via git describe.'
        required: false
      to_ref:
        description: 'Head ref to audit to (defaults to github.sha).'
        required: false

concurrency:
  group: claude-code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      id-token: none
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.sha }}
          INPUT_FROM_REF: ${{ inputs.from_ref }}
          INPUT_TO_REF: ${{ inputs.to_ref }}
        run: bash .github/scripts/release-determine-scope.sh

      - name: Release audit (code review + security)
        id: audit
        if: steps.scope.outputs.skip_audit != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
            --allowed-tools "Read,Glob,Grep,Bash(gh api:*)"
          prompt: |
            You are performing a release audit on tag `${{ github.ref_name }}` at commit `${{ github.sha }}`.

            This is NOT a PR review — there is no open pull request. Post no PR comments or inline diff annotations.
            Instead, report findings in your response only; issue creation is handled downstream.

            Follow these project rules when reviewing (you may read them from `.claude/rules/` using the Read tool):
            - Rule 10 (server-only boundary): DynamoDB and AWS SDK only in server code
            - Rule 20 (data model conventions): UTC, USD, model-first breakdown, response shape
            - Rule 40 (design system & stack): no raw hex, lazy-load charts, dark mode default
            - Rule 50 (security & secrets): no static AWS keys, Auth.js session checks, no logging secrets
            - Rule 60 (coding standards): strict TypeScript, no @ts-ignore, no console.log, 80%+ test coverage

            ## Files to review at HEAD
            The following files were added, modified, or renamed since the previous release. If this list is empty, the release was deletions-only — skip this section.
            ${{ steps.scope.outputs.files }}

            ## Removed files
            The following files were deleted. Grep the rest of the tree for leftover imports or dead references. If empty, no files were removed.
            ${{ steps.scope.outputs.removed_files }}

            ## Security audit
            Security audit required: ${{ steps.scope.outputs.security_relevant }}
            ${{ steps.scope.outputs.security_relevant == 'true' && 'Audit the changed files for OWASP Top 10 + project-specific issues: hardcoded secrets/API keys/credentials; missing Auth.js session checks in Route Handlers (must return 401); server-only boundary violations (@aws-sdk/* or DynamoDB client in client/shared code); static AWS keys (project uses SSO + AWS_PROFILE per Rule 50); secrets in logs or telemetry; vulnerable dependencies introduced by this release.' || 'No security audit required for this release — skip security findings.' }}

            Severity scale: HIGH = directly exploitable; MEDIUM = exploitable under specific conditions; LOW = best-practice.

            ## Output format

            End your response with BOTH of these fenced blocks (emit empty sections — zero counts — when nothing found).
            Only HIGH-severity code-review findings appear in `code-review-summary`; discuss MEDIUM/LOW in prose only.

            ```security-summary
            HIGH: <count>
            MEDIUM: <count>
            LOW: <count>
            HIGH_FINDINGS:
            - <one-line per HIGH, or "none">
            MEDIUM_FINDINGS:
            - <one-line per MEDIUM, or "none">
            ```

            ```code-review-summary
            HIGH: <count>
            HIGH_FINDINGS:
            - <one-line per HIGH, or "none">
            ```

      - name: Create issues for HIGH/MEDIUM security + HIGH code-review findings
        if: steps.audit.conclusion == 'success'
        uses: actions/github-script@v9
        env:
          AUDIT_OUTPUT: ${{ steps.audit.outputs.result }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/release-create-issues.cjs');
            await run({ github, context, core, env: process.env });
