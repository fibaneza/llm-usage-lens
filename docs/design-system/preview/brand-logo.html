<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo & wordmark" subtitle="Blue→navy gradient mark · Fira Code wordmark" viewport="700x210" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap:0; }
  .hero { display:flex; align-items:center; gap:16px; padding:8px 0 20px; }
  .name { font-family:var(--font-heading); font-size:34px; font-weight:600; letter-spacing:-0.02em; color:var(--fg); }
  .meta { margin-left:auto; text-align:right; }
  .meta div { font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--fg-subtle); line-height:1.7; }
  .variants { display:flex; gap:12px; }
  .v { flex:1; height:68px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; gap:9px; border:1px solid var(--border-subtle); }
</style></head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="sg" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E40AF"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs></svg>

  <div class="hero">
    <svg width="44" height="44" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg>
    <span class="name">Strata</span>
    <div class="meta"><div>mark: 3 offset layers</div><div>gradient: #1E40AF → #3B82F6</div><div>wordmark: Fira Code SemiBold</div></div>
  </div>
  <div class="variants">
    <div class="v" style="background:var(--bg)"><svg width="26" height="26" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg><span class="name" style="font-size:18px">Strata</span></div>
    <div class="v" style="background:var(--surface-1)"><svg width="26" height="26" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg></div>
    <div class="v" style="background:var(--accent-gradient)"><span class="name" style="font-size:18px;color:#fff">Strata</span></div>
  </div>
</body></html>
