<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Foreground text ramp" subtitle="#0F172A → faint, 5 steps — slate family" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .rowx { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid var(--border-subtle); }
  .rowx:last-child { border-bottom:0; }
  .s { font-size:15px; font-weight:500; font-family:var(--font-sans); }
  .t { font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--fg-subtle); }
</style></head>
<body>
  <div class="card" style="padding:4px 0">
    <div class="rowx"><span class="s" style="color:var(--fg)">Foreground — headings &amp; key figures <span style="font-family:var(--font-mono);font-size:var(--text-2xs)">#0F172A</span></span><span class="t">--fg</span></div>
    <div class="rowx"><span class="s" style="color:var(--fg-secondary)">Secondary — body copy <span style="font-family:var(--font-mono);font-size:var(--text-2xs)">#334155</span></span><span class="t">--fg-secondary</span></div>
    <div class="rowx"><span class="s" style="color:var(--fg-muted)">Muted — labels, axis ticks <span style="font-family:var(--font-mono);font-size:var(--text-2xs)">#64748B</span></span><span class="t">--fg-muted</span></div>
    <div class="rowx"><span class="s" style="color:var(--fg-subtle)">Subtle — placeholders, meta <span style="font-family:var(--font-mono);font-size:var(--text-2xs)">#94A3B8</span></span><span class="t">--fg-subtle</span></div>
    <div class="rowx"><span class="s" style="color:var(--fg-faint)">Faint — disabled <span style="font-family:var(--font-mono);font-size:var(--text-2xs)">#CBD5E1</span></span><span class="t">--fg-faint</span></div>
  </div>
</body></html>
