<!DOCTYPE html>
<!-- @dsCard group="Type" name="Labels, KPIs & legend" subtitle="Eyebrow labels, deltas, chart legend" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display:flex; gap:32px; }
  .blk { display:flex; flex-direction:column; gap:8px; }
  .kpi .label { margin-bottom:2px; }
  .kpi .metric-lg { font-size:28px; }
  .delta { font-family:var(--font-mono); font-size:var(--text-xs); font-feature-settings:'tnum' 1; }
  .neg { color:var(--neg); } .pos { color:var(--pos); }
  .legend { display:flex; align-items:center; gap:6px; font-size:var(--text-2xs); color:var(--fg-muted); }
  .dot { width:8px; height:8px; border-radius:2px; }
</style></head>
<body>
  <div class="stack">
    <div class="blk kpi">
      <div class="label">Total spend · MTD</div>
      <div class="metric-lg">$48,210.34</div>
      <div class="delta neg">▲ 18.3% vs. prior 30d</div>
    </div>
    <div class="blk kpi">
      <div class="label">Invocations</div>
      <div class="metric-lg">1.94M</div>
      <div class="delta pos">▼ 4.1% vs. prior 30d</div>
    </div>
  </div>
  <div class="row" style="gap:18px; margin-top:4px;">
    <div class="legend"><span class="dot" style="background:var(--chart-1)"></span> Claude 3.5 Sonnet</div>
    <div class="legend"><span class="dot" style="background:var(--chart-2)"></span> Titan Text</div>
    <div class="legend"><span class="dot" style="background:var(--chart-3)"></span> Llama 3</div>
    <div class="legend subtle">eyebrow + legend · 11–12 / 500</div>
  </div>
</body></html>
