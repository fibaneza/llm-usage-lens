<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand accent — indigo gradient" subtitle="#3730A3 → #4F46E5 gradient + amber warning" viewport="700x250" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { gap:10px; }
  .big { height:88px; border-radius:var(--radius-lg); display:flex; flex-direction:column; justify-content:flex-end; padding:12px; }
  .small-sw { height:54px; border-radius:var(--radius-md); border:1px solid var(--border-subtle); display:flex; align-items:flex-end; padding:8px; }
  .n { font-size:var(--text-xs); font-weight:600; font-family:var(--font-sans); }
  .t { font-family:var(--font-mono); font-size:var(--text-2xs); }
  .row3 { display:flex; gap:10px; }
  .ctx { display:flex; align-items:center; gap:10px; }
  .btn { height:30px; padding:0 14px; display:inline-flex; align-items:center; border-radius:var(--radius-md);
    background:var(--accent-gradient); color:#fff; font-size:var(--text-sm); font-weight:600; font-family:var(--font-sans); }
  .nav-item { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 11px; border-radius:var(--radius-md);
    color:var(--color-secondary); background:var(--accent-subtle); font-size:var(--text-sm); font-weight:600; font-family:var(--font-sans); }
  .nav-item .dot { width:8px; height:8px; border-radius:2px; background:var(--color-primary); }
  .ring-box { height:30px; padding:0 11px; display:inline-flex; align-items:center; border-radius:var(--radius-md);
    background:var(--surface-2); border:1px solid var(--color-primary); box-shadow:0 0 0 2px var(--ring);
    color:var(--fg-muted); font-size:var(--text-sm); font-family:var(--font-sans); }
  .amber-swatch { height:30px; padding:0 11px; display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius-md);
    background:var(--warn-bg); border:1px solid var(--warn); color:var(--warn); font-size:var(--text-sm); font-family:var(--font-sans); font-weight:500; }
</style></head>
<body>
  <div class="big" style="background:var(--accent-gradient)">
    <span class="n" style="color:#fff">--accent-gradient · primary → secondary</span>
    <span class="t" style="color:rgba(255,255,255,.85)">#3730A3 → #4F46E5 · primary buttons · logo · hero</span>
  </div>
  <div class="row3">
    <div class="small-sw" style="background:var(--color-primary)"><span class="t" style="color:#fff">primary #4F46E5</span></div>
    <div class="small-sw" style="background:var(--color-secondary)"><span class="t" style="color:#fff">secondary #6366F1</span></div>
    <div class="small-sw" style="background:var(--accent-subtle); border:1px solid var(--color-primary)"><span class="t" style="color:var(--color-secondary)">subtle · selected tint</span></div>
  </div>
  <div class="ctx">
    <span class="btn">Export CSV</span>
    <span class="nav-item"><span class="dot"></span>Overview</span>
    <span class="ring-box">Focus ring</span>
    <span class="amber-swatch">⚑ 92% of budget</span>
  </div>
  <div style="font-size:var(--text-2xs); color:var(--fg-subtle); font-family:var(--font-sans)">Amber (#D97706) is reserved for warnings &amp; cost alerts — not the brand accent</div>
</body></html>
