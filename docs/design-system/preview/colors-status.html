<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Semantic status" subtitle="Positive / negative / warning / info" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(2,1fr); gap:12px; }
  .st { border-radius:var(--radius-md); border:1px solid; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .st .h { display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:var(--radius-full); }
  .st .name { font-size:var(--text-sm); font-weight:600; color:var(--fg); }
  .st .use { font-size:var(--text-2xs); color:var(--fg-muted); }
  .st .t { font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--fg-subtle); }
</style></head>
<body>
  <div class="grid">
    <div class="st" style="background:var(--pos-bg); border-color:var(--pos)">
      <div class="h"><span class="dot" style="background:var(--pos)"></span><span class="name">Positive</span></div>
      <div class="use">Spend down · under budget · ▼</div><div class="t">--pos / --pos-bg</div>
    </div>
    <div class="st" style="background:var(--neg-bg); border-color:var(--neg)">
      <div class="h"><span class="dot" style="background:var(--neg)"></span><span class="name">Negative</span></div>
      <div class="use">Spend up · over budget · ▲</div><div class="t">--neg / --neg-bg</div>
    </div>
    <div class="st" style="background:var(--warn-bg); border-color:var(--warn)">
      <div class="h"><span class="dot" style="background:var(--warn)"></span><span class="name">Warning</span></div>
      <div class="use">Approaching budget threshold</div><div class="t">--warn / --warn-bg</div>
    </div>
    <div class="st" style="background:var(--info-bg); border-color:var(--info)">
      <div class="h"><span class="dot" style="background:var(--info)"></span><span class="name">Info</span></div>
      <div class="use">Neutral annotation · sync state</div><div class="t">--info / --info-bg</div>
    </div>
  </div>
</body></html>
