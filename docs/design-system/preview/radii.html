<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm/md/lg/xl/full" viewport="700x180" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns: repeat(5,1fr); gap:14px; }
  .r { display:flex; flex-direction:column; gap:8px; align-items:center; }
  .r .box { width:100%; height:60px; background:var(--surface-2); border:1px solid var(--border-strong); border-top-left-radius:var(--r); border-top-right-radius:var(--r); }
  .r .t { font-family:var(--font-mono); font-size:var(--text-2xs); color:var(--fg-subtle); text-align:center; }
  .r .n { font-size:var(--text-xs); font-weight:600; color:var(--fg); }
</style></head>
<body>
  <div class="grid">
    <div class="r"><div class="box" style="--r:4px"></div><div class="n">sm</div><div class="t">4px · chips</div></div>
    <div class="r"><div class="box" style="--r:6px"></div><div class="n">md</div><div class="t">6px · controls</div></div>
    <div class="r"><div class="box" style="--r:8px"></div><div class="n">lg</div><div class="t">8px · cards</div></div>
    <div class="r"><div class="box" style="--r:12px"></div><div class="n">xl</div><div class="t">12px · modals</div></div>
    <div class="r"><div class="box" style="--r:999px;border-radius:999px"></div><div class="n">full</div><div class="t">pills · badges</div></div>
  </div>
</body></html>
