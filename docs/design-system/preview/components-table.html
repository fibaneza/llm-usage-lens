<!DOCTYPE html>
<!-- @dsCard group="Components" name="Data table" subtitle="TanStack-style sortable cost table" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { padding:0; width:700px; }
  table { width:100%; border-collapse:collapse; }
  thead th { text-align:left; font-size:var(--text-2xs); letter-spacing:var(--tracking-label); text-transform:uppercase;
    color:var(--fg-subtle); font-weight:500; padding:12px 16px; border-bottom:1px solid var(--border); white-space:nowrap; }
  thead th.num, tbody td.num { text-align:right; font-family:var(--font-mono); font-feature-settings:'tnum' 1,'zero' 1; }
  thead th.sorted { color:var(--fg); }
  tbody td { padding:11px 16px; font-size:var(--text-sm); color:var(--fg-secondary); border-bottom:1px solid var(--border-subtle); }
  tbody tr:hover { background:var(--surface-hover); }
  .model { display:flex; align-items:center; gap:9px; }
  .swatch { width:9px; height:9px; border-radius:2px; flex:none; }
  .model .nm { color:var(--fg); font-weight:500; }
  .cost { color:var(--fg); }
  .pct { color:var(--fg-muted); }
  .bar { display:inline-block; height:5px; border-radius:3px; vertical-align:middle; margin-left:8px; }
  .arrow { display:inline-flex; vertical-align:-2px; margin-left:2px; }
  .arrow svg { width:12px; height:12px; }
</style></head>
<body>
  <table>
    <thead><tr>
      <th class="sorted">Model</th>
      <th class="num">Invocations</th>
      <th class="num">Input tok</th>
      <th class="num">Cost <span class="arrow"><i data-lucide="chevron-down"></i></span></th>
      <th class="num">% of total</th>
    </tr></thead>
    <tbody>
      <tr><td><span class="model"><span class="swatch" style="background:var(--chart-1)"></span><span class="nm">Claude 3.5 Sonnet</span></span></td><td class="num">842,109</td><td class="num">512.4M</td><td class="num cost">$16,402.18</td><td class="num pct">34.0%<span class="bar" style="width:48px;background:var(--chart-1)"></span></td></tr>
      <tr><td><span class="model"><span class="swatch" style="background:var(--chart-2)"></span><span class="nm">Titan Text Express</span></span></td><td class="num">410,882</td><td class="num">301.0M</td><td class="num cost">$11,090.44</td><td class="num pct">23.0%<span class="bar" style="width:33px;background:var(--chart-2)"></span></td></tr>
      <tr><td><span class="model"><span class="swatch" style="background:var(--chart-3)"></span><span class="nm">Llama 3 70B</span></span></td><td class="num">288,540</td><td class="num">198.7M</td><td class="num cost">$7,713.66</td><td class="num pct">16.0%<span class="bar" style="width:23px;background:var(--chart-3)"></span></td></tr>
      <tr><td><span class="model"><span class="swatch" style="background:var(--chart-4)"></span><span class="nm">Claude 3 Haiku</span></span></td><td class="num">196,304</td><td class="num">142.1M</td><td class="num cost">$5,785.24</td><td class="num pct">12.0%<span class="bar" style="width:17px;background:var(--chart-4)"></span></td></tr>
    </tbody>
  </table>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
