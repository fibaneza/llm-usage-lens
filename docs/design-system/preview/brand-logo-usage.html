<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo usage do/don't" subtitle="Clearspace, color, contrast rules" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { border-radius:var(--radius-md); border:1px solid var(--border); padding:12px; display:flex; flex-direction:column; gap:9px; }
  .tile .h { display:flex; align-items:center; gap:6px; font-size:var(--text-xs); font-weight:600; }
  .tile .h svg.ic { width:14px; height:14px; }
  .ok .h { color:var(--pos); } .no .h { color:var(--neg); }
  .stage { height:54px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; gap:7px; }
  .nm { font-size:16px; font-weight:600; letter-spacing:-0.01em; }
</style></head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="sg" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sgBad" x1="4" y1="6" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DD68C"/><stop offset="1" stop-color="#FF6B9D"/>
    </linearGradient>
  </defs></svg>

  <div class="grid">
    <div class="tile ok">
      <div class="h"><i data-lucide="check"></i> Gradient mark on black / surface</div>
      <div class="stage" style="background:var(--bg)"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg><span class="nm" style="color:var(--fg)">Strata</span></div>
    </div>
    <div class="tile ok">
      <div class="h"><i data-lucide="check"></i> Min clearspace = mark height</div>
      <div class="stage" style="background:var(--surface-1); padding:0 22px; justify-content:flex-start"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg><span class="nm" style="color:var(--fg)">Strata</span></div>
    </div>
    <div class="tile no">
      <div class="h"><i data-lucide="x"></i> Don't change the gradient hues</div>
      <div class="stage" style="background:var(--bg)"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sgBad)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sgBad)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sgBad)" fill-opacity="0.46"/></svg><span class="nm" style="color:var(--fg)">Strata</span></div>
    </div>
    <div class="tile no">
      <div class="h"><i data-lucide="x"></i> Don't place on busy / low-contrast</div>
      <div class="stage" style="background:var(--accent-gradient)"><svg width="22" height="22" viewBox="0 0 32 32"><rect x="4" y="6" width="18" height="5" rx="1.5" fill="url(#sg)"/><rect x="8" y="13.5" width="20" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.72"/><rect x="4" y="21" width="16" height="5" rx="1.5" fill="url(#sg)" fill-opacity="0.46"/></svg><span class="nm" style="color:#fff">Strata</span></div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body></html>
